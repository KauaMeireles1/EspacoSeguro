<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produtos - KM Motors</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      color: #333;
    }

    .produto {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: #fafafa;
    }

    img {
      width: 150px;
      margin-bottom: 10px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      color: #fff;
      background-color: #007bff;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nossos Produtos</h1>

    <div class="produto">
      <img src="rede.png" alt="Rede Aranha">
      <h2>Rede Aranha 35x35</h2>
      <p>Ideal para prender capacetes e objetos com segurança.</p>
      <p><strong>R$ 29,90</strong></p>
    </div>

    <a href="index.html">← Voltar para o início</a>
  </div>
</body>
</html>
